# SecurityNet 统一配置文件
# 所有安全工具的硬编码参数集中管理，修改此文件即可调整工具行为
# 加载器: config/security_net_loader.py

# ═══════════════════════════════════════════
# 编排器配置 (IntelligentOrchestrator)
# ═══════════════════════════════════════════
orchestrator:
  version: "2.0.0"
  report_engine: "弥娅 SecurityNet 智能编排引擎"

  # 扫描策略
  strategies:
    recon:
      name: "信息收集"
      description: "仅侦察：端口 + 子域名 + DNS + 在线资产"
      phases: [1]
    quick:
      name: "快速评估"
      description: "侦察 → 分析（自动查工具/漏洞）"
      phases: [1, 2, 4]
    full:
      name: "全面评估"
      description: "侦察 → 分析 → Nmap → 漏洞扫描 → 威胁情报"
      phases: [1, 2, 3, 4]
    webapp:
      name: "Web 专项"
      description: "HTTP头 → 目录爆破 → 注入检测 → 工具推荐"
      phases: [1, 2]
    deep:
      name: "全链路自动化"
      description: "侦察 → 分析 → 沙箱自动利用 → 威胁情报 → 报告"
      phases: [1, 2, 3, 4, 5]

  # 各阶段工具配置
  phase1_tools:
    - [子域名枚举, security_subdomain_enum, {domain: "{target}"}]
    - [DNS 枚举, security_dns_enum, {domain: "{target}"}]
    - [端口扫描, security_port_scan, {target: "{target}"}]

  phase1_extra:
    - [在线资产 FOFA, security_online_asset, {service: "fofa", query: 'domain="{target}"'}]
    - [在线资产 Shodan, security_online_asset, {service: "shodan", query: "hostname:{target}"}]
    - [Nmap 扫描, security_nmap_scan, {target: "{target}", mode: "full"}]
    - [HTTP 头分析, security_http_headers, {url: "https://{target}"}]
    - [SSL 证书, security_ssl_cert, {hostname: "{target}"}]

  phase3_tools:
    - [目录爆破, security_dir_brute, {url: "https://{target}"}]
    - [Web 漏洞扫描, security_web_vuln_scanner, {url: "https://{target}"}]

  # 服务识别模式 (regex, service_name, product_description)
  service_patterns:
    - regex: 'Apache/[\d.]+'
      service: Apache
      product: 'Apache HTTP Server'
    - regex: 'nginx/[\d.]+'
      service: nginx
      product: Nginx
    - regex: 'OpenSSH[_\s]?[\d.]+'
      service: OpenSSH
      product: 'SSH 服务器'
    - regex: 'MySQL[_\s]?[\d.]+'
      service: MySQL
      product: 'MySQL 数据库'
    - regex: 'PostgreSQL[\s\d.]+'
      service: PostgreSQL
      product: 'PostgreSQL 数据库'
    - regex: 'PHP/[\d.]+'
      service: PHP
      product: PHP
    - regex: 'WordPress/[\d.]+'
      service: WordPress
      product: 'WordPress CMS'
    - regex: 'Tomcat/[\d.]+'
      service: Tomcat
      product: 'Apache Tomcat'
    - regex: 'Microsoft-IIS/[\d.]+'
      service: IIS
      product: 'Microsoft IIS'
    - regex: 'Redis[\s\d.]+'
      service: Redis
      product: 'Redis 缓存'
    - regex: 'MongoDB[\s\d.]+'
      service: MongoDB
      product: 'MongoDB 数据库'
    - regex: 'Elasticsearch[\s\d.]+'
      service: Elasticsearch
      product: Elasticsearch
    - regex: 'Node\.js[\s\d.]+'
      service: Node.js
      product: Node.js
    - regex: 'Express[\s\d.]+'
      service: Express
      product: 'Express 框架'
    - regex: 'Django/[\d.]+'
      service: Django
      product: 'Django 框架'
    - regex: 'Flask[\s\d.]+'
      service: Flask
      product: 'Flask 框架'
    - regex: 'Spring[\s\d.]+'
      service: Spring
      product: 'Spring Framework'
    - regex: 'jQuery[\s\d.]+'
      service: jQuery
      product: jQuery
    - regex: 'Bootstrap/[\d.]+'
      service: Bootstrap
      product: Bootstrap
    - regex: 'Microsoft-HTTPAPI/[\d.]+'
      service: Microsoft-HTTPAPI
      product: 'Windows HTTP'
    - regex: 'Jetty[\s\d.]+'
      service: Jetty
      product: 'Eclipse Jetty'

