# ═══════════════════════════════════════════
# HTTP 响应头安全分析配置
# ═══════════════════════════════════════════
http_headers:
  # 安全头检查规则: [header_name, severity, label, recommendation]
  security_checks:
    - [content-security-policy, high, "CSP（内容安全策略）", "添加 Content-Security-Policy 头限制资源加载来源，防止 XSS 攻击"]
    - [strict-transport-security, high, "HSTS（HTTP严格传输安全）", "添加 Strict-Transport-Security 头强制浏览器使用HTTPS"]
    - [x-frame-options, medium, "Clickjacking 防护", "添加 X-Frame-Options: DENY 或 SAMEORIGIN 防止点击劫持"]
    - [x-content-type-options, medium, "MIME 类型嗅探防护", "添加 X-Content-Type-Options: nosniff 防止MIME类型嗅探"]
    - [referrer-policy, low, "Referrer 策略", "添加 Referrer-Policy 头控制跨域请求中的来源信息"]
    - [permissions-policy, low, "权限策略", "添加 Permissions-Policy 头限制浏览器API使用"]
    - [x-permitted-cross-domain-policies, low, "跨域策略", "添加 X-Permitted-Cross-Domain-Policies: none 限制Flash跨域"]

  # 信息泄露头检查: [header_name, severity, label, recommendation]
  info_leak_headers:
    - [server, medium, "服务器版本信息泄露", "移除或通用化 Server 响应头"]
    - [x-powered-by, medium, "技术栈信息泄露", "移除 X-Powered-By 响应头"]
    - [x-aspnet-version, medium, "ASP.NET 版本泄露", "移除 X-AspNet-Version 响应头"]
    - [x-generator, low, "生成器信息泄露", "移除 X-Generator 响应头"]

  request_timeout: 15.0

# ═══════════════════════════════════════════
# DNS 枚举配置
# ═══════════════════════════════════════════
dns_enum:
  default_record_types:
    - A
    - AAAA
    - MX
    - NS
    - CNAME
    - TXT
    - SOA
  resolver_timeout: 5
  analysis_warnings:
    no_mx: "未配置 MX 记录：可能未启用企业邮箱"
    no_spf: "未配置 SPF 记录：存在邮件伪造风险"
    no_dmarc: "未配置 DMARC 记录：建议配置以增强邮件安全"
    spf_loose: "SPF 策略过于宽松（使用 ?all 或 +all），建议使用 -all"
    spf_softfail: "SPF 策略使用 softfail(~all)，建议使用严格模式 -all"

# ═══════════════════════════════════════════
# SSL 证书检查配置
# ═══════════════════════════════════════════
ssl_cert:
  connect_timeout: 10
  warning_days: 90
  critical_days: 30

# ═══════════════════════════════════════════
# 漏洞查询配置 (CVE/NVD)
# ═══════════════════════════════════════════
vuln_lookup:
  nvd_api_base: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  request_timeout: 30.0
  max_limit: 20
  description_max_length: 300

  # 离线知识库回退（NVD 不可用时使用）
  offline_knowledge:
    apache: |
      Apache HTTP Server 常见漏洞：CVE-2021-41773(路径穿越)、CVE-2021-40438(SSRF)、CVE-2022-22720(HTTP请求走私)。建议保持Apache版本为最新。
    nginx: |
      Nginx 常见漏洞：CVE-2021-23017(DNS解析器)、CVE-2019-9511/9513/9516(HTTP/2 DoS)。建议使用最新稳定版。
    mysql: |
      MySQL 常见漏洞：定期关注 Oracle Critical Patch Update。建议使用最新GA版本并配置安全基线。
    redis: |
      Redis 常见安全问题：未授权访问是最常见问题。建议配置 requirepass、bind 到内网、禁用危险命令。
    tomcat: |
      Tomcat 常见漏洞：CVE-2024-21733、CVE-2023-41080。建议使用最新版本并配置安全管理器。
    openssh: |
      OpenSSH 常见漏洞：CVE-2023-38408(ssh-agent)、CVE-2024-6387(regreSSHion)。建议更新到最新版本。
    openssl: |
      OpenSSL 著名漏洞：CVE-2014-0160(Heartbleed)、CVE-2022-3786(Certificate Bypass)。建议更新到最新版本。
    sql injection: |
      SQL注入是最常见的Web漏洞之一。预防措施：使用参数化查询、ORM框架、输入验证、WAF。关键CVE：各CMS/系统中广泛存在。
    xss: |
      跨站脚本(XSS)是最常见的Web漏洞之一。预防措施：输入输出编码、CSP头部、HttpOnly Cookie。关键CVE：各Web应用广泛存在。
    log4j: |
      Log4Shell (CVE-2021-44228) CVSS 10.0 — 影响 Log4j 2.0-2.14.1 的所有版本。CVE-2021-45046 是后续修复绕过。建议立即升级到 2.17.0+。
    spring: |
      Spring Framework 常见漏洞：CVE-2022-22965(Spring4Shell) CVSS 9.8 — JDK9+ 上的 Spring MVC。CVE-2022-22963(Spring Cloud Function)。
    wordpress: |
      WordPress 安全提醒：主题/插件是最常见的攻击面。CVE-2023-2745、CVE-2023-6933 等。建议保持核心/主题/插件更新，使用 WAF。
    iis: |
      Microsoft IIS 常见漏洞：CVE-2021-31166(HTTP协议栈)、CVE-2017-7269(WebDAV)。建议安装最新补丁，禁用不必要的模块。

  offline_fallback_message: |
    未找到相关漏洞信息
    NVD API 可能不可用。建议：
    1. 访问 https://nvd.nist.gov 手动搜索
    2. 访问 https://www.exploit-db.com 搜索漏洞利用
    3. 检查网络连接后重试

# ═══════════════════════════════════════════
# Sploitus / Exploit-DB 搜索配置
# ═══════════════════════════════════════════
sploitus:
  api_base: "https://sploitus.com"
  exploitdb_search_url: "https://www.exploit-db.com/search"
  request_timeout: 15.0

# ═══════════════════════════════════════════
# Web 漏洞扫描配置
# ═══════════════════════════════════════════
web_vuln_scanner:
  request_timeout: 15.0

  # SQL 注入测试 payload
  sql_payloads:
    - ['"', 引号错误]
    - ["'", SQL语法错误]
    - ["1' OR '1'='1", 条件注入]
    - ["1' AND '1'='2", 条件注入]
    - ["1' UNION SELECT NULL--", UNION注入]
    - [") OR ('1'='1", 括号注入]
    - ["'; WAITFOR DELAY '0:0:5'--", 时间盲注(SQL Server)]
    - ["' OR SLEEP(5)--", 时间盲注(MySQL)]

  # XSS 测试 payload
  xss_payloads:
    - ["<script>alert(1)</script>", 基础XSS]
    - ["<img src=x onerror=alert(1)>", IMG事件XSS]
    - ["<svg onload=alert(1)>", SVG事件XSS]
    - ["javascript:alert(1)", JS协议XSS]

  # SQL 错误检测模式
  sql_error_patterns:
    - 'SQL syntax.*MySQL'
    - 'Warning.*mysql_'
    - 'MySQLSyntaxErrorException'
    - 'valid MySQL result'
    - 'PostgreSQL.*ERROR'
    - 'Warning.*\Wpg_'
    - 'Driver.*SQL'
    - 'SQLite/JDBCDriver'
    - 'SQLite.Exception'
    - 'Microsoft OLE DB.*SQL'
    - '\[SQL Server\]'
    - 'ODBC SQL Server Driver'
    - 'Oracle error'
    - 'ORA-[0-9]{5}'
    - 'Microsoft JET Database Engine'
    - 'Unclosed quotation mark'
    - 'quoted string not properly terminated'
    - 'SQL command not properly ended'

  # 信息泄露检测模式: [regex, label, severity]
  leak_patterns:
    - regex: '(?:password|passwd|pwd)\s*[:=]\s*[''"]?\w+[''"]?'
      label: 硬编码密码
      severity: critical
    - regex: '(?:api[_-]?key|apikey|secret)\s*[:=]\s*[''"]?\w+[''"]?'
      label: API密钥泄露
      severity: critical
    - regex: '(?:jdbc:|mongodb://|mysql://|postgresql://|redis://)\S+'
      label: 数据库连接串泄露
      severity: high
    - regex: '(?:aws_access_key|AWS_ACCESS_KEY)\s*[:=]\s*[''"]?\w+[''"]?'
      label: AWS密钥泄露
      severity: critical
    - regex: '(?:-----BEGIN\s(?:RSA\s)?PRIVATE\sKEY-----)'
      label: 私钥泄露
      severity: critical
    - regex: '<!--[\s\S]*?(?:TODO|FIXME|HACK|BUG)[\s\S]*?-->'
      label: 注释中的敏感信息
      severity: medium
    - regex: 'stack\s*trace:'
      label: 错误堆栈泄露
      severity: medium
    - regex: '(?:\d{1,3}\.){3}\d{1,3}'
      label: 内部IP泄露
      severity: low

  # 错误页面信息泄露模式: [regex, label, severity]
  error_page_patterns:
    - regex: 'at\s+[\w.]+\([\w.]+:\d+\)'
      label: 堆栈跟踪泄露
      severity: high
    - regex: 'Exception:\s*\w+'
      label: 异常信息泄露
      severity: medium
    - regex: "File\\s*['\"].*?\\.\\w+['\"]"
      label: 文件路径泄露
      severity: medium
    - regex: 'Version:\s*[\d.]+'
      label: 版本信息泄露
      severity: low
    - regex: 'Apache Tomcat/[\d.]+'
      label: 服务器版本泄露
      severity: low
    - regex: 'nginx/[\d.]+'
      label: 服务器版本泄露
      severity: low

