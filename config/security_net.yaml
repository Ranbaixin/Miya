# ═══════════════════════════════════════════
# CTF / BugBounty 工作流配置
# ═══════════════════════════════════════════
ctf_workflow:
  categories:
    web:
      name: "Web安全"
      tools:
        - BurpSuite - sqlmap - dirsearch - nuclei - xray
      techniques:
        - "SQL注入 (联合查询/盲注/时间盲注)"
        - "XSS (反射型/存储型/DOM型)"
        - "SSRF (内网探测/云元数据/Redis攻击)"
        - "文件上传 (前端绕过/Content-Type/文件头/条件竞争)"
        - "反序列化 (Java/PHP/Python Pickle)"
        - "SSTI (Jinja2/Twig/FreeMarker)"
        - "命令注入 (管道符/反引号/$IFS绕过)"
        - "XXE (外带数据/内网探测)"
        - "认证绕过 (JWT伪造/Session劫持)"
    crypto:
      name: "密码学"
      tools:
        - CyberChef - RsaCtfTool - yafu - hashcat
      techniques:
        - "古典密码 (凯撒/维吉尼亚/栅栏/培根)"
        - "RSA攻击 (共模/小指数/维纳/费马)"
        - "分组密码 (CBC字节翻转/Padding Oracle)"
        - "哈希长度扩展攻击"
        - "格密码 (LLL算法)"
    pwn:
      name: "二进制漏洞"
      tools:
        - pwntools - ghidra - gdb - checksec - ROPgadget
      techniques:
        - "栈溢出 (ret2text/ret2libc/ret2syscall)"
        - "格式化字符串 (任意读写/GOT覆写)"
        - "堆利用 (UAF/Fastbin/Tcache)"
        - "整数溢出 (符号/宽度溢出)"
        - "ROP链构造"
    forensics:
      name: "数字取证"
      tools:
        - Volatility - binwalk - foremost - exiftool - Steghide
      techniques:
        - "内存取证 (进程列表/注册表/网络连接)"
        - "磁盘取证 (文件恢复/MFT分析)"
        - "流量分析 (Wireshark/tshark 过滤)"
        - "隐写分析 (LSB/频域/元数据)"
        - "日志分析 (Web/系统/安全日志)"
    rev:
      name: "逆向工程"
      tools:
        - Ghidra - "IDA Free" - jadx - x64dbg - dnSpy
      techniques:
        - "静态分析 (反汇编/反编译)"
        - "动态调试 (断点/内存修改)"
        - "脱壳去花 (反反调试/反虚拟机)"
        - "算法逆向 (加密/压缩/校验)"
    misc:
      name: "杂项"
      tools:
        - CyberChef - zsteg - foremost
      techniques:
        - "编码解码 (Base64/Hex/Unicode/Morse)"
        - "协议分析 (自定义协议/PCAP)"
        - "Python沙箱逃逸"
        - "游戏逆向 (Unity/IL2CPP)"
    osint:
      name: "开源情报"
      tools:
        - Sherlock - theHarvester - "Maltego CE"
      techniques:
        - "社交账号搜索"
        - "域名/WHOIS 反查"
        - "图片EXIF/GPS分析"
        - "证书透明度日志 (crt.sh)"
        - "Google Dork"

  category_specific_advice:
    web: |
      优先检查：1) 页面源代码和JS文件中的注释/API端点
      2) URL 参数和 Cookie 中的特殊值
      3) HTTP 响应头是否有异常
      4) 尝试常见的弱口令和默认凭据
      5) 检查 robots.txt 和 sitemap.xml
    crypto: |
      优先检查：1) 题目提供的加密算法和参数
      2) 是否有已知的数学攻击方法
      3) 密文是否有模式（重复、长度）
      4) 尝试用 CyberChef 进行快速编码解码
      5) 考虑侧信道信息（时间、文件名）
    pwn: |
      优先检查：1) checksec 查看保护机制
      2) 分析程序逻辑找溢出点
      3) 用 gdb/pwndbg 调试确认偏移
      4) 检查 libc 版本（libc database查找）
      5) 注意 one_gadget 条件
    forensics: |
      优先检查：1) file 命令确认文件类型
      2) strings 提取可读字符串
      3) binwalk 提取嵌套文件
      4) exiftool 查看元数据
      5) 搜索常见隐藏数据特征（PK头/Zip头/PNG尾）
    rev: |
      优先检查：1) file 确认文件类型和架构
      2) strings 查找关键字符串（flag/密码/提示）
      3) 搜索硬编码常量和密钥
      4) 用反编译器查看主逻辑
      5) 识别常见加密算法（AES/RSA/自定义）
    misc: |
      优先检查：1) 从最简单的方法开始
      2) 检查所有附件中的隐藏信息
      3) 尝试不同的编码解码工具
      4) 搜索题目名称和描述中的提示
      5) 查看比赛平台的历史 writeup
    osint: |
      优先检查：1) Google Image Search 搜索图片
      2) 查看图片 EXIF/GPS 数据
      3) 社交媒体平台搜索用户名
      4) Wayback Machine 查看历史版本
      5) 证书透明度日志 (crt.sh)

  bugbounty_flow:
    title: "BugBounty 漏洞赏金工作流"
    phases:
      - {phase: 1, name: "侦察", actions: [
          "子域名枚举 → subfinder/amass/OneForAll",
          "端口扫描 → nmap/masscan/naabu",
          "技术指纹 → Wappalyzer/WhatWeb/BuiltWith",
          "URL采集 → waybackurls/gau/katana"]}
      - {phase: 2, name: "映射与分析", actions: [
          "目录枚举 → dirsearch/ffuf/gobuster",
          "参数发现 → paramspider/arjun",
          "JS分析 → LinkFinder/SecretFinder",
          "API端点收集 → Swagger/GraphQL"]}
      - {phase: 3, name: "漏洞发现", actions: [
          "自动化扫描 → nuclei/xray/yakit（注意流量）",
          "手动测试 → SQL注入/XSS/SSRF/任意文件读取",
          "业务逻辑 → IDOR/竞态条件/支付绕过",
          "配置错误 → CORS/Cloud Storage/.git泄露"]}
      - {phase: 4, name: "利用验证", actions: [
          "概念证明 → 最小化PoC，不破坏数据",
          "影响评估 → 确定漏洞实际危害范围",
          "截图留证 → 清晰展示漏洞利用过程"]}
      - {phase: 5, name: "报告撰写", actions: [
          "标题 + 严重程度 (CVSS评分)",
          "复现步骤 (清晰、可操作)",
          "影响说明 (业务/数据/合规)",
          "修复建议 (具体、可行)"]}
    principles:
      - "遵守规则 — 仅测试在赏金范围内定义的目标"
      - "不破坏数据 — 禁止真实攻击，仅做漏洞验证"
      - "及时报告 — 发现漏洞后通过平台提交"
      - "不公开披露 — 漏洞修复前不公开发布细节"
      - "保持专业 — 尊重厂商响应时间"

