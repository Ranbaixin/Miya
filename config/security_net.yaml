# ═══════════════════════════════════════════
# Nmap 扫描配置
# ═══════════════════════════════════════════
nmap_scan:
  default_timeout: 180
  max_timeout: 300
  scan_types:
    quick: "-T4 -F"
    full: "-T4 -sV -sC -O"
    stealth: "-T2 -sS -Pn"
    udp: "-sU -T4 --top-ports 100"
    version: "-sV --version-intensity 5"
    script: "-sC --script=default,vuln"
    all: "-T4 -A -p-"

# ═══════════════════════════════════════════
# 在线资产搜索配置 (FOFA/Shodan/Censys...)
# ═══════════════════════════════════════════
online_asset:
  request_timeout: 20.0

  supported_services:
    fofa:
      name: FOFA
      desc: "中国领先的网络空间搜索引擎"
      base_url: "https://fofa.info/api/v1/search/all"
      auth_type: api_key
      register_url: "https://fofa.info/"
    shodan:
      name: Shodan
      desc: "全球互联网设备搜索引擎"
      base_url: "https://api.shodan.io/shodan/host/search"
      auth_type: api_key
      register_url: "https://account.shodan.io/"
    censys:
      name: Censys
      desc: "互联网资产发现平台"
      base_url: "https://search.censys.io/api/v2/hosts/search"
      auth_type: api_id_secret
      register_url: "https://search.censys.io/account/api"
    quake:
      name: Quake
