# ============================================================
# 寮ュ▍ MIYA - QQ 鏈哄櫒浜虹粺涓€閰嶇疆
# 鐗堟湰: 3.0.0
# 璇存槑: 鏁村悎鎵€鏈?QQ 鐩稿叧閰嶇疆鍒颁竴涓枃浠?
# ============================================================

qq:
  # ===== 鍩虹杩炴帴閰嶇疆 =====
  connection:
    ws_url: "ws://localhost:3001"        # OneBot WebSocket 鍦板潃
    token: ""                             # 璁块棶浠ょ墝锛堝彲閫夛級
    bot_qq: 1153409562                              # 鏈哄櫒浜?QQ 鍙?
    superadmin_qq: 869135903                      # 瓒呯骇绠＄悊鍛?QQ 鍙?
    reconnect_interval: 5.0               # 閲嶈繛闂撮殧锛堢锛?
    ping_interval: 20                     # 蹇冭烦闂撮殧锛堢锛?
    ping_timeout: 30                      # 蹇冭烦瓒呮椂锛堢锛?
    max_message_size: 104857600           # 鏈€澶ф秷鎭ぇ灏忥紙100MB锛?

  # ===== 璁块棶鎺у埗 =====
  access_control:
    enabled: false                        # 鏄惁鍚敤璁块棶鎺у埗
    group_whitelist: []                   # 缇ょ櫧鍚嶅崟锛堢┖琛ㄧず鍏佽鎵€鏈夌兢锛?
    group_blacklist: []                   # 缇ら粦鍚嶅崟
    user_whitelist: []                    # 鐢ㄦ埛鐧藉悕鍗曪紙绌鸿〃绀哄厑璁告墍鏈夌敤鎴凤級
    user_blacklist: []                    # 鐢ㄦ埛榛戝悕鍗?

  # ===== 澶氬獟浣撳鐞?=====
  multimedia:
    # 鍥剧墖澶勭悊
    image:
      max_size: 10485760                  # 10MB
      allowed_formats: [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".webp"]
      auto_resize: true
      max_width: 1920
      max_height: 1080
      quality: 85                         # JPEG 璐ㄩ噺锛?-100锛?

    # 鏂囦欢澶勭悊
    file:
      max_size: 52428800                  # 50MB
      allowed_types:
        - txt
        - pdf
        - doc
        - docx
        - xls
        - xlsx
        - ppt
        - pptx
        - md
        - json
        - xml
        - html
        - csv
        - yml
        - yaml
        - py
        - js
        - ts
        - java
        - cpp
        - c
        - go
        - rs
        - php
        - rb
        - sh
        - log

    # 璇煶澶勭悊
    voice:
      enabled: false                      # 鏄惁鍚敤璇煶娑堟伅澶勭悊
      stt_enabled: false                  # 璇煶杞枃瀛楋紙闇€瑕侀澶?API锛?

    # 涓婁紶璁剧疆
    upload:
      temp_dir: "./temp/uploads"          # 涓存椂涓婁紶鐩綍
      cleanup_hours: 24                   # 娓呯悊鏃堕棿锛堝皬鏃讹級
      keep_original: false                # 鏄惁淇濈暀鍘熷鏂囦欢

  # ===== 鍥剧墖璇嗗埆閰嶇疆 =====
  image_recognition:
    # OCR 璁剧疆锛堝凡绂佺敤锛屼粎浣跨敤瑙嗚妯″瀷锛?
    ocr:
      enabled: false
      engine: "none"
      languages: []
      confidence_threshold: 0.0

    # AI 鍥剧墖鍒嗘瀽锛堜娇鐢?Kimi K2.6 鍘熺敓澶氭ā鎬佹ā鍨嬶級
    ai_analysis:
      enabled: true
      model: "zhipu_glm_46v_flash"
      timeout: 30                         # 鏈€澶у垎鏋愭椂闂达紙绉掞級
      cost_threshold: 0.0                 # 鎴愭湰闃堝€硷紙鍏嶈垂妯″瀷锛?
      provider: ""                        # baidu, tencent, openai
      api_key: ""
      api_secret: ""

    # 瀹夊叏妫€娴?
    safety:
      enabled: true
      nsfw_detection: true
      max_skin_ratio: 0.3                 # 鏈€澶ц偆鑹叉瘮渚?

    # 缂撳瓨璁剧疆
    cache:
      enabled: true
      dir: "./temp/image_cache"
      max_size: 1073741824                # 1GB
      expire_hours: 24

  # ===== 娑堟伅瑙ｆ瀽閰嶇疆 =====
  message_parsing:
    enable_reply_parsing: true            # 鏄惁鍚敤寮曠敤娑堟伅瑙ｆ瀽
    enable_file_parsing: true             # 鏄惁鍚敤鏂囦欢娑堟伅瑙ｆ瀽
    enable_media_detection: true          # 鏄惁鍚敤澶氬獟浣撴娴?
    show_placeholder_in_text: true        # 鏄惁鍦ㄦ枃鏈腑鏄剧ず寮曠敤/鏂囦欢鍗犱綅绗?

  # ===== 鍚堝苟杞彂閰嶇疆 =====
  forward:
    enable_parsing: true                  # 鏄惁鍚敤鍚堝苟杞彂瑙ｆ瀽
    max_expand_depth: 3                   # 鏈€澶у睍寮€灞傛暟

  # ===== 鍔熻兘寮€鍏?=====
  features:
    poke_reply: true                      # 鎴充竴鎴冲洖澶?
    emoji_request: true                   # 琛ㄦ儏鍖呰姹?
    welcome_new_member: false             # 娆㈣繋鏂版垚鍛?
    scheduled_tasks: true                 # 瀹氭椂浠诲姟
    passive_chat: true                    # 琚姩鑱婂ぉ锛堝叧閿瘝瑙﹀彂锛?
    active_chat: true                     # 涓诲姩鑱婂ぉ

  # ===== 鍛戒护閰嶇疆 =====
  commands:
    prefix: "/"                           # 鍛戒护鍓嶇紑
    # 娉ㄦ剰锛氬懡浠ゅ叧閿瘝宸茬Щ鑷?text_config.json 鐨?command_keywords
    # 娉ㄦ剰锛氶敊璇秷鎭凡绉昏嚦 text_config.json 鐨?error_messages

  # ===== 浠诲姟璋冨害 =====
  task_scheduler:
    enabled: true
    database:
      path: "./data/tasks.db"             # SQLite 鏁版嵁搴撹矾寰?
      backup_dir: "./data/backups"
      backup_interval: 86400              # 澶囦唤闂撮殧锛堢锛?
    execution:
      max_concurrent: 5                   # 鏈€澶у苟鍙戜换鍔℃暟
      timeout: 300                        # 浠诲姟瓒呮椂鏃堕棿锛堢锛?
      retry_delay_base: 60                # 閲嶈瘯鍩虹寤惰繜锛堢锛?
      max_retry_delay: 3600               # 鏈€澶ч噸璇曞欢杩燂紙绉掞級
    monitoring:
      log_level: "INFO"
      keep_history_days: 30               # 淇濈暀鍘嗗彶澶╂暟
      alert_on_failure: true              # 澶辫触鏃跺憡璀?
    statistics:
      collect_stats: true
      stats_interval: 3600                # 缁熻鏀堕泦闂撮殧锛堢锛?

  # ===== 娑堟伅姹囨€荤獥鍙ｆ湡閰嶇疆 =====
  # 鐢ㄤ簬缇よ亰涓秷鎭瘑闆嗘椂锛屾敹闆嗕竴娈垫椂闂村唴鐨勬秷鎭啀缁熶竴鍥炲
  message_batching:
    enabled: true                         # 鏄惁鍚敤娑堟伅姹囨€荤獥鍙?
    window_seconds: 5                     # 绐楀彛鏈熸椂闀匡紙绉掞級锛屾敹鍒版柊娑堟伅浼氶噸缃鏃?
    max_window_seconds: 10                # 鏈€澶х獥鍙ｆ湡锛堥槻姝㈡棤闄愮瓑寰咃級
    max_messages: 15                      # 绐楀彛鏈熷唴鏈€澶ф秷鎭暟閲忥紝瓒呰繃鍒欑珛鍗冲鐞?
    only_group: false                     # 鏄惁浠呭缇よ亰鐢熸晥锛坒alse鏃剁鑱婁篃鍙備笌娑堟伅姹囨€伙級
    cooldown_seconds: 3                   # 涓ゆ潯娑堟伅闂撮殧灏忎簬姝ゆ椂闀挎墠瑙﹀彂绐楀彛鏈?
    status_message: ""                    # 绐楀彛鏈熷唴鐨勭姸鎬佹彁绀猴紙鐣欑┖鍒欎笉鍙戦€侊級

  # ===== 娑堟伅闃熷垪閰嶇疆 =====
  # 6杞﹂亾浼樺厛绾ч槦鍒楋細superadmin/缇よ秴绾х鐞嗗憳/绉佽亰/缇/缇ゆ櫘閫?鍚庡彴
  message_queue:
    enabled: true                         # 鏄惁鍚敤娑堟伅闃熷垪
    default_interval: 1.0                # 榛樿鍙戣溅闂撮殧锛堢锛夛紝瓒婂皬瓒婂揩鍝嶅簲
    # 鍚勬ā鍨嬬嫭绔嬪彂杞﹂棿闅旓紙鍙€夛級
    model_intervals:
      default: 1.0
      # deepseek_v3: 0.5                  # deepseek妯″瀷鍙互璁剧疆鏇村揩
      # glm_4: 1.0                        # glm妯″瀷鎸夐粯璁?

  # ===== 鎬ц兘浼樺寲 =====
  performance:
    cache:
      message_history: 100                # 娑堟伅鍘嗗彶缂撳瓨鏉℃暟
      user_info: 1000                     # 鐢ㄦ埛淇℃伅缂撳瓨鏁?
      group_info: 100                     # 缇や俊鎭紦瀛樻暟
    thread_pool:
      max_workers: 10                     # 鏈€澶у伐浣滅嚎绋嬫暟
      thread_timeout: 30                  # 绾跨▼瓒呮椂鏃堕棿锛堢锛?
    memory:
      max_image_cache: 1073741824         # 鍥剧墖缂撳瓨鏈€澶у唴瀛橈紙1GB锛?
      cleanup_interval: 3600              # 鍐呭瓨娓呯悊闂撮殧锛堢锛?

  # ===== 鏃ュ織閰嶇疆 =====
  logging:
    level: "INFO"
    file: "./logs/qq.log"
    max_size: 10485760                    # 10MB
    backup_count: 5
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    log_message_detail: false             # 鏄惁璁板綍娑堟伅璇︽儏
    debug: false                          # 鏄惁璁板綍璋冭瘯淇℃伅
    retention_days: 7                     # 鏃ュ織淇濈暀澶╂暟

    # 缁勪欢鏃ュ織绾у埆
    components:
      client: "INFO"
      message_handler: "INFO"
      image_handler: "INFO"
      file_handler: "INFO"
      active_chat: "INFO"
      task_scheduler: "INFO"

  # ===== 璋冭瘯璁剧疆 =====
  debug:
    enabled: false
    log_raw_messages: false               # 璁板綍鍘熷娑堟伅
    log_api_calls: false                  # 璁板綍 API 璋冪敤
    log_file_operations: false            # 璁板綍鏂囦欢鎿嶄綔
    test_mode: false
    mock_apis: false                      # 妯℃嫙 API 璋冪敤
    simulate_errors: false                # 妯℃嫙閿欒

# ===== 宸ュ叿閰嶇疆 =====
tools:
  qq_image:
    enabled: true
    max_file_size: 10485760               # 10MB
    allowed_sources: ["local", "url", "base64"]
    auto_resize: true
    default_caption: ""

  qq_file:
    enabled: true
    max_file_size: 52428800               # 50MB
    allowed_sources: ["local", "url"]
    check_file_type: true
    warn_unsupported: true

  qq_emoji:
    enabled: true
    standard_emojis: true                 # 鍚敤鏍囧噯琛ㄦ儏
    custom_emojis: true                   # 鍚敤鑷畾涔夎〃鎯?
    emoji_dir: "./data/emoji"             # 琛ㄦ儏鍖呯洰褰?

  qq_file_reader:
    enabled: true
    max_preview_length: 2000              # 鏈€澶ч瑙堥暱搴?
    auto_detect_encoding: true
    supported_formats:
      - ".txt"
      - ".log"
      - ".md"
      - ".pdf"
      - ".doc"
      - ".docx"
      - ".json"
      - ".xml"
      - ".html"
      - ".py"
      - ".js"
      - ".ts"
      - ".java"
    ocr:
      enabled: false                      # 绂佺敤 OCR
      timeout: 0                          # OCR 瓒呮椂鏃堕棿锛堢锛?
      languages: []                       # 涓嶆敮鎸佷换浣曡瑷€

  qq_image_analyzer:
    enabled: true
    ocr_engine: "none"                    # 涓嶄娇鐢?OCR 寮曟搸
    vision_engine: "zhipu_glm_46v_flash"  # 浣跨敤鏅鸿氨瑙嗚妯″瀷
    detail_level: "detailed"              # detailed, basic
    nsfw_check: false
    ai_description:
      enabled: false
      provider: ""
      api_key: ""

  qq_active_chat:
    enabled: true
    allow_setup: true
    allow_trigger_now: true
    max_scheduled_tasks: 100              # 鏈€澶ч瀹氫换鍔℃暟
    schedule_formats:
      - "HH:MM"                           # 姣忓ぉ鍥哄畾鏃堕棿
      - "YYYY-MM-DD HH:MM"               # 鍏蜂綋鏃ユ湡鏃堕棿
      - "daily HH:MM"                     # 姣忓ぉ
      - "weekly DAY HH:MM"               # 姣忓懆
      - "in N minutes/hours/days"        # 鐩稿鏃堕棿

  task_scheduler_enhanced:
    enabled: true
    db_path: "./data/tasks.db"
    auto_start: true                      # 鑷姩鍚姩
    auto_recover: true                    # 鑷姩鎭㈠浠诲姟
    max_retries: 3                        # 鏈€澶ч噸璇曟鏁?
    retry_backoff: "exponential"          # 閲嶈瘯閫€閬跨瓥鐣?
    alerts:
      enabled: true
      failure_threshold: 5                # 澶辫触闃堝€?
      alert_interval: 3600                # 鍛婅闂撮殧锛堢锛?

# ===== 鎻掍欢閰嶇疆 =====
plugins:
  ocr:
    paddleocr:
      enabled: false                      # 绂佺敤 PaddleOCR
      use_gpu: false
      lang: "none"                        # 涓嶄娇鐢ㄤ换浣曡瑷€
    tesseract:
      enabled: false                      # 绂佺敤 Tesseract
      data_path: ""
      languages: []

  image_processing:
    pillow:
      enabled: true
      max_image_pixels: 89478485          # 鏈€澶у儚绱犳暟
    opencv:
      enabled: false                      # 闇€瑕侀澶栧畨瑁?

  file_processing:
    chardet:
      enabled: true                       # 缂栫爜妫€娴?
    pypdf2:
      enabled: true                       # PDF 澶勭悊
    python_docx:
      enabled: true                       # Word 鏂囨。澶勭悊

# ===== 鍏煎鎬ч厤缃?=====
compatibility:
  onebot:
    implementations:                      # 鏀寔鐨?OneBot 瀹炵幇
      - "go-cqhttp"
      - "mirai"
      - "nonebot"
      - "custom"
    check_apis: true                      # API 鍏煎鎬ф鏌?
    fallback_methods: true                # 鍚敤澶囬€夋柟娉?
    message_formats:
      support_array: true                 # 鏀寔鏁扮粍鏍煎紡
      support_string: true                # 鏀寔瀛楃涓叉牸寮?
      auto_detect: true                   # 鑷姩妫€娴?
  legacy:
    old_qq_py: false                      # 鍏煎鏃х殑 qq.py
    import_aliases: true                  # 瀵煎叆鍒悕
