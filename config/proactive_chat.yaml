# 弥娅主动聊天系统配置
# 包含时间感知、情绪感知、关键词触发、上下文触发、AI触发
# 支持所有终端：QQ群聊、QQ私聊、终端等
proactive_chat:
  # 基本配置
  enabled: true
  check_interval: 45  # 轮询间隔（秒）：仅做确定性检查，不产生 AI 调用
  max_daily_messages: 5  # 每日每会话主动消息硬上限（15 → 5 降频）
  quiet_hours: [23, 0, 1, 2, 3, 4, 5, 6, 7]  # 静默时段
  target_ttl_hours: 168  # 无互动会话上下文保留时长（小时），超时移出轮询（0 = 不清理）

  # 支持的终端类型
  platforms:
    - qq_group      # QQ群聊
    - qq_private    # QQ私聊
    - terminal      # 终端
    - web           # Web API

  # 上下文触发 - 行为期望跟进
  context_trigger:
    enabled: true
    use_ai: true   # AI 动态生成回复，以下固定回复仅作 fallback
    # 用户行为完成后的跟进回复
    expectations:
      吃完:
        - "吃完了？好吃吗。"
        - "吃饱了吗？"
        - "吃得怎么样？"
      睡完:
        - "睡好了？怎么样？"
        - "睡够了吗？"
        - "休息好了吗？"
      锻炼完:
        - "锻炼完了？累吗。"
        - "运动完啦？累不累？"
        - "锻炼怎么样？"
      看完:
        - "看完了？怎么样。"
        - "看完啦？感觉如何？"
        - "怎么样？好看吗？"
      看完医生:
        - "看完了？医生怎么说。"
        - "医生怎么说的？"
        - "检查结果怎么样？"
      醒来:
        - "醒了？休息好了吗。"
        - "睡醒啦？"
        - "起来啦？"
      回来:
        - "回来了？今天怎么样。"
        - "回来啦？"
        - "到家了吗？"
      下班:
        - "下班了？今天辛苦了。"
        - "下班啦？"
        - "辛苦啦~"
      放学:
        - "放学啦？回家了吗？"
        - "放学啦~"
        - "今天学习怎么样？"
      泡面好了:
        - "泡面好了。去吃吧。"
        - "泡面好了哦~快去吃吧"
      default:
        - "怎么样了？"
        - "完成了吗？"
        - "怎么样？"

  # 情绪感知配置
  emotion_perception:
    enabled: true
    use_ai: true   # AI 动态生成回复
    # 情绪关键词
    emotion_keywords:
      happy:
        keywords: ["开心", "高兴", "快乐", "棒", "不错", "好", "喜欢", "爱", "兴奋", "激动", "爽", "舒服"]
        response_strategy: "share_joy"
      sad:
        keywords: ["难过", "伤心", "失落", "沮丧", "失望", "郁闷", "低落", "抑郁", "想哭"]
        response_strategy: "comfort"
      tired:
        keywords: ["累", "疲惫", "困", "疲劳", "困倦", "没精神", "没力气", "好累"]
        response_strategy: "rest"
      anxious:
        keywords: ["焦虑", "担心", "紧张", "不安", "害怕", "恐惧"]
        response_strategy: "calm"
      angry:
        keywords: ["生气", "愤怒", "恼火", "烦躁", "气愤", "不爽", "气"]
        response_strategy: "soothe"
      lonely:
        keywords: ["孤独", "寂寞", "孤单", "一个人", "没人陪"]
        response_strategy: "accompany"
    
    # 情绪回应 - 增加更多变体
    emotion_responses:
      happy:
        - "、真好~我也很开心！"
        - "哇，太好了！"
        - "我也为你高兴！"
        - "太好了！为你开心~"
        - "这么棒的吗~我也要开心了！"
      sad:
        - "抱抱你~我在呢"
        - "怎么啦？跟我说说"
        - "难过的话，我陪你"
        - "心疼你...发生什么了？"
        - "想哭就哭吧，我在~"
      tired:
        - "辛苦了~休息一下吧"
        - "累的话就休息，不用硬撑"
        - "我陪你~休息一下"
        - "累了就歇歇~别硬撑"
        - "辛苦了亲爱的~"
      anxious:
        - "别担心，有我在"
        - "先深呼吸，慢慢来"
        - "我在呢，别怕~"
        - "我陪着你~"
        - "放轻松~"
      angry:
        - "谁惹你生气啦？"
        - "消消气~我在"
        - "怎么啦？跟我说说"
      lonely:
        - "我一直都在~"
        - "寂寞了吗？我陪你"
        - "我在呢~"

  # 关键词触发
  keyword_trigger:
    enabled: true
    use_ai: true   # AI 动态生成回复
    keywords:
      - "在吗"
      - "干嘛"
      - "忙吗"
      - "忙啥"
      - "睡觉"
      - "睡"
      - "吃饭"
      - "吃"
      - "学习"
      - "下班"
      - "下班了"
      - "放学"
      - "回来"
      - "回家"
      - "起床"
      - "醒了"
      - "锻炼"
      - "运动"
    responses:
      - "在的~有什么事吗？"
      - "嗯呢，收到啦！"
      - "怎么啦？"
      - "我在的~"
      - "怎么啦？想说啥？"

  # 主动关怀
  check_in:
    enabled: true
    use_ai: true   # AI 动态生成回复
    check_interval: 10800  # 闲置 3 小时才算"久未互动"（降频：3600 → 10800）
    messages:
      - "在干嘛呢？"
      - "最近怎么样？"
      - "有什么想聊的吗？"
      - "有没有好好吃饭？"
      - "睡得好吗？"
      - "今天过得怎么样？"
      - "在想什么呢？"

  # AI触发 - AI自主判断
  ai_trigger:
    enabled: true
    eval_interval_seconds: 7200  # AI 自主判断评估间隔（秒）：2 小时评估一次（原 check_interval/max_per_hour 为死配置已移除）
  # 时间感知配置
  time_awareness:
    enabled: false    # 暂时关闭时间触发
    use_ai: true   # AI 动态生成回复
    time_slots:
      morning:
        start: 6
        end: 9
        greeting_keywords: ["早", "早上好", "早安"]
        topics:
          - category: "health"
            weight: 0.3
            templates: ["睡得好吗？", "今天感觉怎么样？"]
          - category: "plan"
            weight: 0.4
            templates: ["今天有什么计划？", "今天要做什么？"]
          - category: "mood"
            weight: 0.3
            templates: ["今天心情怎么样？", "新的一天开始了"]
      
      afternoon:
        start: 12
        end: 14
        greeting_keywords: ["午", "午安", "下午好"]
        topics:
          - category: "health"
            weight: 0.4
            templates: ["吃过午饭了吗？", "休息一下吧"]
          - category: "work"
            weight: 0.3
            templates: ["下午工作顺利吗？", "工作累了吗？"]
          - category: "mood"
            weight: 0.3
            templates: ["下午心情怎么样？", "午休了吗？"]
      
      evening:
        start: 17
        end: 21
        greeting_keywords: ["晚", "晚上好", "傍晚"]
        topics:
          - category: "health"
            weight: 0.3
            templates: ["吃过晚饭了吗？", "今天累吗？"]
          - category: "summary"
            weight: 0.4
            templates: ["今天过得怎么样？", "今天有什么收获吗？"]
          - category: "plan"
            weight: 0.3
            templates: ["明天有什么计划？", "晚上有什么安排？"]
      
      night:
        start: 21
        end: 6
        greeting_keywords: ["晚安", "夜深了", "该睡了"]
        topics:
          - category: "health"
            weight: 0.5
            templates: ["该休息了", "早点睡吧", "晚安"]
          - category: "reflection"
            weight: 0.3
            templates: ["今天辛苦了", "好好休息"]
          - category: "tomorrow"
            weight: 0.2
            templates: ["明天见", "做个好梦"]

  trigger_type_cooldown:
    context: 60      # 上下文触发后60秒内不再触发
    emotion: 120    # 情绪触发后120秒内不再触发
    keyword: 5     # 关键词触发后5秒内不再触发
    time: 300       # 时间触发后5分钟内不再触发（时段内只发一次）
    check_in: 14400  # 主动关怀后4小时内不再触发（降频：1800 → 14400）
    ai: 7200         # AI 自主发言后2小时内不再触发（与评估间隔对齐：180 → 7200）

  # 用户刚发送消息后的冷却（秒）
  # 避免在用户刚说话后立即主动发言
  user_message_cooldown: 5

  # === 场景感知主动策略 ===
  scene_awareness:
    enabled: true

    # 平台衰减乘数 (1.0 = 全概率, 0.0 = 不触发)
    platform_multipliers:
      terminal: 0.9
      webchat: 0.8
      aiocqhttp_private: 1.0
      aiocqhttp_group: 0.8
      qqofficial_private: 0.9
      qqofficial_group: 0.3
      lark: 0.25
      generic: 0.15

    # 群聊活跃度影响
    group_activity:
      inactive_threshold: 300     # 5分钟无消息视为不活跃
      active_message_window: 120   # 2分钟内的消息数判定活跃度
      inactive_multiplier: 0.8     # 不活跃群提权
      active_multiplier: 0.5      # 活跃群降权
      recent_at_boost: 0.6         # 最近被@过的群大幅提权

    # 混合策略
    mixed_strategy:
      enabled: true
      layer1_min_probability: 0.3   # Layer1 概率低于此值直接跳过
      layer2_ai_judge: true         # Layer2 让 AI 做最终判决
