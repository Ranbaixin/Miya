[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "miya"
version = "8.0.0"
description = "弥娅 (MIYA) - AI 虚拟化身"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Miya Team" },
]

dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn[standard]>=0.22.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-multipart>=0.0.6",
    "starlette>=0.30.0,<1.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "packaging>=23.0",
    "certifi>=2024.0.0",
    "numpy>=1.24.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.3.0,<2.0.0",
    "tiktoken>=0.5.0",
    "anthropic>=0.7.0,<1.0.0",
    "zhipuai>=4.0.0,<5.0.0",
    "google-generativeai>=0.8.0",
    "dashscope>=1.20.0",
    "sentence-transformers>=2.2.0,<3.0.0",
    "faiss-cpu>=1.7.0",
    "rank-bm25>=0.2.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0,<5.0.0",
]

database = [
    "chromadb>=0.4.0,<0.6.0",
    "pymilvus>=2.3.0,<2.5.0",
    "neo4j>=5.0.0,<6.0.0",
    "redis>=4.5.0,<6.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "sqlmodel>=0.0.16",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0,<2.0.0",
    "scikit-learn>=1.3.0,<1.6.0",
]

office = [
    "PyPDF2>=3.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markitdown>=0.0.1",
]

network = [
    "httpx>=0.24.0",
    "websockets>=12.0",
    "quart>=0.19.0",
    "flask>=3.0.0",
    "hypercorn>=0.17.0",
    "jinja2>=3.1.0",
    "aiodocker>=0.21.0",
    "aiomqtt>=0.2.0",
]

tts = [
    "edge-tts>=6.1.0,<7.0.0",
    "funasr-onnx>=0.1.0",
    "simpleaudio>=1.0.4",
    "pyffmpeg>=2.4.0",
    "pilk>=0.2.0",
    "genie-tts",
]

viz = [
    "matplotlib>=3.7.0,<4.0.0",
]

qq-extras = [
    "pillow>=10.0.0",
    "chardet>=5.1.0",
    "python-magic>=0.4.27",
    "tenacity>=8.2.0",
    "jieba>=0.42.1",
    "loguru>=0.7.0",
    "qrcode>=7.4.0",
    "playwright>=1.40.0",
    "pyserial>=3.5",
    "python-ripgrep",
]

platform = [
    "qq-botpy>=1.0.0",
    "python-telegram-bot>=20.0",
    "telegramify-markdown>=0.1.0",
    "discord.py>=2.0.0",
    "lark-oapi>=1.0.0",
    "wechatpy>=1.8.0",
    "pycryptodome>=3.20.0",
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.20.0",
    "line-bot-sdk>=3.0.0",
    "MattermostDriver>=7.0.0",
]

observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation>=0.42b0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

scheduler = [
    "apscheduler>=3.10.0",
]

win32 = [
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "black>=23.12.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "isort>=5.13.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ipython>=8.18.0",
    "ipdb>=0.13.0",
    "py-spy>=0.3.14",
    "memory-profiler>=0.61.0",
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "selenium>=4.15.0",
    "fastmcp>=2.0.0",
    "docstring-parser>=0.15.0",
    "pydantic-settings>=2.0.0",
    "watchfiles>=0.21.0",
    "croniter>=2.0.0",
]

[tool.uv.sources]
genie-tts = { git = "https://github.com/High-Logic/Genie-TTS.git" }
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = ["-v", "--tb=short"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "utils", "config"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
