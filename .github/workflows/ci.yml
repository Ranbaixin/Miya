name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0'

env:
  PYTHON_VERSION: '3.11'

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install tools
      run: |
        pip install "ruff>=0.14.0,<0.15.0" black bandit
        ruff --version

    - name: Run ruff linting
      run: ruff check . --config pyproject.toml --output-format=github

    - name: Run black formatting check
      run: black --check core/ hub/ run/ 2>&1 | head -30
      continue-on-error: true

    - name: Run security audit
      run: bandit -r core/ hub/ run/ -ll -f custom
      continue-on-error: true

  invariants:
    name: Exception Swallowing Invariants
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install ruff
      run: pip install "ruff>=0.14.0,<0.15.0"

    # P9 防线：存量违规已被 per-file-ignores 一次性豁免，本 job 只检查
    # diff 实际新增的行是否引入新的 S110/S112/BLE001/E722 违规（豁免表只减不增）。
    - name: Check for new exception-swallowing violations
      env:
        BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        BASE="${BASE_REF:-HEAD~1}"
        echo "diff base: ${BASE}"
        python scripts/check_new_swallowed.py "$BASE"

  dead-code-guard:
    name: Dead Code Guard
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run import graph check
      run: python scripts/import_graph.py --check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install system dependencies
      run: sudo apt-get update -y && sudo apt-get install -y libasound2-dev

    - name: Install dependencies
      run: |
        uv venv
        uv pip install -r setup/requirements/full.txt -r setup/dependencies/dev.txt

    - name: Run unit tests
      # P8/P9 可信回归基线：仅跑 tests/unit/（根目录遗留测试引用已删模块，待独立清理）
      # 2026-09：default-groups 收敛为 runtime 后，pytest 在 dev 组，显式带上
      run: uv run --group dev pytest tests/unit/ -q -p no:cacheprovider

    - name: Upload coverage
      if: hashFiles('coverage.xml') != ''
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unit

  config-guard:
    name: Config Guard (doctor 静态检查)
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install minimal deps for probes
      # doctor C5 依赖探针需要的最小集合（CI 只验证静态契约，不装全量依赖）
      run: pip install pyyaml httpx requests beautifulsoup4 python-dotenv openai tiktoken tenacity jieba apscheduler aiohttp pillow chardet

    - name: Run doctor static checks
      # C1 死配置 / C2 配置解析 / C3 模型配置（视觉能力契约）/ C4 prompt 占位符 /
      # C5 依赖探针 / C6 环境变量（CI 无 .env → 仅报缺文件级 WARN）/ C7 权限配置
      run: |
        python scripts/doctor.py --json > doctor_report.json || DOCTOR_FAILED=1
        cat doctor_report.json
        exit ${DOCTOR_FAILED:-0}

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run secret scan
      run: |
        python scripts/scan_secrets.py

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [quality-checks, unit-tests, secret-scan, config-guard]
    if: always()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
    - name: Send Slack notification
      if: env.SLACK_WEBHOOK != ''
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#ci-cd'
        username: GitHub Actions
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Update GitHub PR status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const message = status === 'success' ? 'All checks passed!' : 'Some checks failed';

          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.payload.pull_request.head.sha,
            state: status,
            description: message,
            context: 'CI/CD Pipeline'
          });
